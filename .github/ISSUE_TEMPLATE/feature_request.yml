name: Feature Request
description: Suggest an improvement for SelectSight extension or web tools
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Use Case / Problem
      description: What workflow or image type are you trying to handle?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Improvement
    validations:
      required: true
